name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      focused_tests:
        description: 'Gradle --tests filter (e.g. com.chaya.app.diagnostics.*). Empty = full suite.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed without extra API calls: compare the PR merge-base
  # against HEAD using git (checkout fetches full history). Test-only PRs
  # skip the APK build (it cannot fail if no main-source file changed)
  # while every PR still runs the unit tests.
  changes:
    runs-on: ubuntu-latest
    outputs:
      main_code: ${{ steps.filter.outputs.main_code }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          echo "Diff base: $BASE"
          if git diff --name-only "$BASE" HEAD -- \
            'app/src/main/**' 'app/build.gradle.kts' 'gradle/**' \
            'build.gradle.kts' 'settings.gradle.kts' 'gradle.properties' \
            | grep -q .; then
            echo "main_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_code=false" >> "$GITHUB_OUTPUT"
          fi
          # A pull request that changes only Chaya for Windows (desktop/, its workflows) or the docs builds nothing
          # of the phone's: it skips the build below (a skipped job, so it never holds up a merge).
          if git diff --name-only "$BASE" HEAD \
            | grep -v -E '^(desktop/|docs/|\.github/workflows/desktop[^/]*\.yml$|[^/]+\.md$)' | grep -q .; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy installs the app's Python packages with a build-machine Python of the same version.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Project has no checked-in wrapper jar; provide Gradle directly.
      # Cache is shared across branches (cache-read-only false) so PR runs
      # reuse main's dependency + build cache entries.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      # One Gradle invocation for both tasks: a single daemon, one
      # configuration phase, and test task outputs reused by the assembler.
      # workflow_dispatch `focused_tests` narrows to a --tests filter for
      # fast iteration; CI still runs the FULL suite on every push/PR.
      - name: Run unit tests
        run: |
          if [ -n "${{ inputs.focused_tests }}" ]; then
            gradle testDebugUnitTest --stacktrace --tests "${{ inputs.focused_tests }}"
          else
            gradle testDebugUnitTest --stacktrace
          fi

      # The full reports (with each failure's message, stack and output) for when the log is not enough.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      # The APK build is skipped for test-only changes: assembling proves
      # main-source compilation, which test-only diffs cannot affect. The
      # unit-test task above already compiles main sources in all cases.
      - name: Build debug APK
        if: needs.changes.outputs.main_code == 'true'
        run: gradle assembleDebug --stacktrace

      # Android Lint over the app's code, resources and manifest. A finding not listed in
      # app/lint-baseline.xml fails the build, a warning as much as an error.
      - name: Android Lint
        if: needs.changes.outputs.main_code == 'true'
        run: gradle lintDebug --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload APK
        if: needs.changes.outputs.main_code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Signed release APK on version tags (Phase 5.1/5.2: direct APK via
  # GitHub Releases). Requires KEYSTORE_BASE64 + KEYSTORE_PASSWORD +
  # KEY_ALIAS + KEY_PASSWORD repo secrets; without them the job fails with
  # a clear message instead of shipping an unsigned build as "release".
  # Create a key once: keytool -genkeypair -keystore chaya-release.keystore
  # -alias chaya -keyalg RSA -keysize 2048 -validity 10000, then store the
  # base64 of the keystore file in KEYSTORE_BASE64.
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy installs the app's Python packages with a build-machine Python of the same version.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      # The tag names the version the phone shows (versionName), so a release is never labelled with another one.
      - name: Check the tag names the app's version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          # What changed, written for the person, when there is a file for this version; GitHub's list of
          # pull requests otherwise.
          notes="docs/releases/android-$version.md"
          if [ -f "$notes" ]; then echo "NOTES=$notes" >> "$GITHUB_ENV"; fi

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set — see build.yml release job docs."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/chaya-release.keystore"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      # One APK per processor type, so a phone downloads only its own (app/build.gradle.kts, chaya.abis): an APK with
      # both is about 43 MB larger. app-release.apk is the phones' (arm64); app-release-x86_64.apk is for emulators
      # and Intel Chromebooks.
      - name: Build signed release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/chaya-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle assembleRelease -Pchaya.abis=arm64-v8a --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          gradle assembleRelease -Pchaya.abis=x86_64 --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/app-release-x86_64.apk
          ls -l dist

      # The release may already exist: GitHub's website makes a tag only by publishing a release with it. Then
      # the APKs and the notes go onto that release. The phone's release is always the repository's latest.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release-x86_64.apk
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}
          make_latest: true

  # The newest build of main at one address that never changes, for the owner to install or update from without
  # digging through runs or unzipping: the `android-preview` pre-release, its APK replaced after every merge that
  # changes the phone's app, once its tests and Lint have passed (`build`).
  # https://github.com/<owner>/<repo>/releases/download/android-preview/Chaya-Android-preview.apk
  # Signed with the release key, so it installs as an update over a release and back: downloads and settings stay. A
  # pre-release is never the repository's "latest", so the phone's releases (v* tags) are untouched.
  preview:
    name: Android preview
    needs: [changes, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.android == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy installs the app's Python packages with a build-machine Python of the same version.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: true

      # The release key, as for a release: a preview signed with any other key could not update the Chaya installed.
      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set — see the release job's docs."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/chaya-release.keystore"

      # One APK per processor type, as for a release: Chaya-Android-preview.apk for phones (arm64), and
      # Chaya-Android-preview-x86_64.apk for emulators and Intel Chromebooks.
      - name: Build the signed release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/chaya-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease -Pchaya.abis=arm64-v8a --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Chaya-Android-preview.apk
          gradle assembleRelease -Pchaya.abis=x86_64 --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Chaya-Android-preview-x86_64.apk
          ls -l Chaya-Android-preview*.apk

      - name: Publish it as the preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Chaya for Android (preview)"
          notes="The newest Chaya for Android, built from ${GITHUB_SHA::7} on main on $(date -u '+%Y-%m-%d at %H:%M UTC').
          It is replaced after every merge that changes the phone's app; it is not a release.
          Open Chaya-Android-preview.apk on the phone to install, or to update the Chaya you have: it is signed as the releases are, so your downloads and settings stay.
          Chaya-Android-preview-x86_64.apk is the same app for emulators and Intel Chromebooks."
          if gh release view android-preview >/dev/null 2>&1; then
            gh release edit android-preview --prerelease --title "$title" --notes "$notes"
          else
            gh release create android-preview --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
          gh release upload android-preview Chaya-Android-preview.apk Chaya-Android-preview-x86_64.apk --clobber

  # Instrumented Compose tests on an emulator (Phase 1.4). Emulator boot is
  # slow (2-5 min), so this never blocks PRs: manual dispatch only (there is
  # no schedule trigger). True page loads stay out — fixtures over live internet.
  instrumented-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy installs the app's Python packages with a build-machine Python of the same version.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      # Without KVM the emulator falls back to software emulation (TCG): boot stalled with
      # "Broken pipe", and the install misread the device ("API level=34 ... < 21").
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Not the action's default -gpu swiftshader_indirect: its SwiftShader GL translator segfaults while Android
          # draws video (see emulator-check.yml).
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --stacktrace
