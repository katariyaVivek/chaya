name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      focused_tests:
        description: 'Gradle --tests filter (e.g. com.chaya.app.diagnostics.*). Empty = full suite.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed without extra API calls: compare the PR merge-base
  # against HEAD using git (checkout fetches full history). Test-only PRs
  # skip the APK build (it cannot fail if no main-source file changed)
  # while every PR still runs the unit tests.
  changes:
    runs-on: ubuntu-latest
    outputs:
      main_code: ${{ steps.filter.outputs.main_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          echo "Diff base: $BASE"
          if git diff --name-only "$BASE" HEAD -- \
            'app/src/main/**' 'app/build.gradle.kts' 'gradle/**' \
            'build.gradle.kts' 'settings.gradle.kts' 'gradle.properties' \
            | grep -q .; then
            echo "main_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Project has no checked-in wrapper jar; provide Gradle directly.
      # Cache is shared across branches (cache-read-only false) so PR runs
      # reuse main's dependency + build cache entries.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      # One Gradle invocation for both tasks: a single daemon, one
      # configuration phase, and test task outputs reused by the assembler.
      # workflow_dispatch `focused_tests` narrows to a --tests filter for
      # fast iteration; CI still runs the FULL suite on every push/PR.
      - name: Run unit tests
        run: |
          if [ -n "${{ inputs.focused_tests }}" ]; then
            gradle testDebugUnitTest --stacktrace --tests "${{ inputs.focused_tests }}"
          else
            gradle testDebugUnitTest --stacktrace
          fi

      # The APK build is skipped for test-only changes: assembling proves
      # main-source compilation, which test-only diffs cannot affect. The
      # unit-test task above already compiles main sources in all cases.
      - name: Build debug APK
        if: needs.changes.outputs.main_code == 'true'
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: needs.changes.outputs.main_code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
