name: Emulator check

# Runs the debug app in a cloud emulator and uploads screenshots, on-screen text
# and logs, so screens and downloads can be checked without a local emulator.
#
#   Pull request: add the `ui-check` label. It re-runs on every push while the label is on.
#   Manually:     Actions > Emulator check > Run workflow (needs this file on the default branch).

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: emulator-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ui-check')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # The walkthrough builds its own small test videos instead of depending on third-party hosts.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain Android image: the Google image's Play services restart themselves after boot
          # and killed the app mid-run.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 .github/scripts/walkthrough.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: evidence/
          if-no-files-found: warn
