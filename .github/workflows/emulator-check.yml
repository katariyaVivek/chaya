name: Emulator check

# Runs the app in a cloud emulator and uploads screenshots, on-screen text and
# logs, so screens and downloads can be checked without a local emulator. It runs
# twice side by side: the debug build, and the release build, which R8 shrinks and
# renames; only the release build shows what R8 broke (a class Python calls by
# name, say). The release build here is signed with the debug key.
#
#   Pull request: add the `ui-check` label. It re-runs on every push while the label is on.
#   Manually:     Actions > Emulator check > Run workflow (needs this file on the default branch).

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: emulator-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ui-check')
    runs-on: ubuntu-latest
    # Room for a second walk on a fresh emulator, when the first one vanishes.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]
    name: walkthrough (${{ matrix.build }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy installs the app's Python packages with a build-machine Python of the same version.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Build the ${{ matrix.build }} APK
        run: gradle assemble${{ matrix.build == 'release' && 'Release' || 'Debug' }} --stacktrace

      # The walkthrough builds its own small test videos instead of depending on third-party hosts.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The build's Gradle and Kotlin daemons stay alive and hold up to 3 GB each next to a 6 GB emulator; the
      # emulator kept vanishing mid-run (adb's port refused, no app crash), the way a process taken by the
      # out-of-memory killer does. Stopped here so the emulator has the runner's memory.
      - name: Stop the build's daemons
        run: |
          gradle --stop
          pkill -f KotlinCompileDaemon || true
          free -m

      # The emulator has vanished mid-run more than once whatever its memory and graphics (see below), which says
      # nothing about the app. The walkthrough tells that apart from the app dying: it leaves evidence/emulator-gone
      # and the job walks through again, once, on a fresh emulator. Any other failure fails the job at once.
      - name: Walk through the app in an emulator
        id: walk
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain Android image: the Google image's Play services restart themselves after boot
          # and killed the app mid-run.
          target: default
          arch: x86_64
          profile: pixel_6
          # The default 2 GB / 2 cores let a playing 720p page, the app and a download starve each other
          # until the emulator stopped answering; the runner has room for more. 4 GB still lost the emulator
          # late in the run on #37 to #41, each time loading the local test page in the last scenarios.
          ram-size: 6144M
          cores: 3
          disable-animations: true
          # Emulator 37.2 vanished (adb's port refused, no app crash, no out-of-memory kill) as the local test page
          # started its three videos, on both builds of #79, after host-side GL errors ("context was preempted") and
          # its host H.264 decoder's "no frame". Android decodes video in software and draws the screen itself, so
          # none of it goes through the host's renderer.
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: BUILD=${{ matrix.build }} python3 .github/scripts/walkthrough.py

      - name: Keep the first walk's evidence
        if: steps.walk.outcome == 'failure' && hashFiles('evidence/emulator-gone') != ''
        run: |
          cat evidence/emulator-gone
          mv evidence evidence-first-walk

      - name: Walk through again on a fresh emulator
        id: walk-again
        if: steps.walk.outcome == 'failure' && hashFiles('evidence-first-walk/emulator-gone') != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: BUILD=${{ matrix.build }} python3 .github/scripts/walkthrough.py

      # The job's verdict: the first walk passed, or its emulator vanished and the second walk passed.
      - name: Walkthrough result
        if: steps.walk.outcome == 'failure' && steps.walk-again.outcome != 'success'
        run: |
          echo "The walkthrough failed; its evidence is uploaded below."
          exit 1

      - name: Look for the out-of-memory killer
        if: failure() || steps.walk.outcome == 'failure'
        run: |
          free -m
          sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' || echo "no out-of-memory kill recorded"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-${{ matrix.build }}
          path: |
            evidence/
            evidence-first-walk/
          if-no-files-found: warn
