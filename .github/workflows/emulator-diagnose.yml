name: Emulator diagnosis (temporary)

# TEMPORARY: finds why the cloud emulator vanishes during the walkthrough. It lives only on this branch, runs on a
# push to it, and is never merged. See .github/scripts/emulator_stress.py.

on:
  push:
    branches: ['claude/dreamy-johnson-id8e1i']

concurrency:
  group: emulator-diagnose
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 1 (run 43803496888): with -gpu guest the video page killed the emulator in 4 of 5 jobs, every time a
          # SIGSEGV in SwiftShader's JIT code on a RenderThread; the text-only and bytes-only pages survived 25 rounds.
          # Round 2: the same video page under each other renderer; the control again beside them.
          - { name: control-guest,          variant: host-media, gpu: 'guest' }
          - { name: swiftshader-1,          variant: host-media, gpu: 'swiftshader_indirect' }
          - { name: swiftshader-2,          variant: host-media, gpu: 'swiftshader_indirect' }
          - { name: angle-1,                variant: host-media, gpu: 'angle_indirect' }
          - { name: angle-2,                variant: host-media, gpu: 'angle_indirect' }
          - { name: swangle-1,              variant: host-media, gpu: 'swangle_indirect' }
          - { name: swangle-2,              variant: host-media, gpu: 'swangle_indirect' }
          - { name: lavapipe-1,             variant: host-media, gpu: 'lavapipe' }
          - { name: lavapipe-2,             variant: host-media, gpu: 'lavapipe' }
    name: stress (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: true
      - name: Build the debug APK
        run: gradle assembleDebug --stacktrace
      - name: Install ffmpeg and gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg gdb
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stop the build's daemons, and have the kernel say what ends a process
        run: |
          gradle --stop
          pkill -f KotlinCompileDaemon || true
          sudo sysctl -w kernel.print-fatal-signals=1
          sudo dmesg -C
          free -m
      # The same emulator, to the letter, as emulator-check.yml
      - name: Repeat the step the emulator dies at
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: VARIANT=${{ matrix.variant }} GDB=0 python3 .github/scripts/emulator_stress.py
      - name: What ended the emulator
        if: always()
        run: |
          echo "===== result"; cat evidence/stress-result.txt || echo "no result written"
          echo "===== kernel log"; sudo dmesg -T | tail -150
          echo "===== memory"; free -m
          echo "===== the emulator's own crash reports"; sudo ls -laR /tmp/android-runner 2>/dev/null | head -80 || true
          mkdir -p evidence/crash && sudo cp -r /tmp/android-runner/. evidence/crash/ 2>/dev/null || true
          sudo chmod -R a+rX evidence || true
          echo "===== gdb"; if [ -f evidence/gdb.txt ]; then grep -v "^\[New Thread\|^\[Thread .* exited\|^Reading symbols\|^(No debugging symbols" evidence/gdb.txt | head -400; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.name }}
          path: evidence/
          if-no-files-found: warn
