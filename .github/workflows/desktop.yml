name: Desktop app

# Chaya for Windows (desktop/): the core crate's tests on Linux (the ad blocker's read the phone's lists), then the Tauri app built on Windows
# into an NSIS installer, kept as a run artifact. On Windows the engine the installer carries (a Python,
# yt-dlp, gallery-dl, chaya_engine, QuickJS and ffmpeg: desktop/engine/prepare.py) is put together first and
# checked without the network. The cut-down ffmpeg that joins picture and sound, and whisper.cpp, which makes subtitles
# on the PC (for the processor, and with Vulkan for the graphics card), are each built once per version of their build
# script (desktop/engine/build_ffmpeg.sh, build_whisper.sh)
# and kept in the Actions cache; so is the Tiny speech model the tests listen with. Titles in this installer use Geist: Cabinet Grotesk's licence keeps its file out of
# the repository (desktop/design/fonts/README.md).

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/src/main/python/**'
      - 'app/src/main/assets/adblock/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/desktop.yml'
  push:
    branches: [ main, master ]
    # A release: windows-v0.1.0 (GitHub does not apply the path filters below to tags).
    tags: [ 'windows-v*' ]
    paths:
      - 'desktop/**'
      - 'app/src/main/python/**'
      - 'app/src/main/assets/adblock/**'
  workflow_dispatch:
    inputs:
      test_signing:
        description: Sign this build with SignPath's test-signing policy (once SignPath is set up; docs/BUILD_AND_TEST.md)
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    name: ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for this build of ffmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ hashFiles('desktop/engine/build_ffmpeg.sh') }}

      # For Windows (cross-compiled with mingw-w64), and for the Linux tests below.
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 meson ninja-build nasm pkg-config
          desktop/engine/build_ffmpeg.sh windows ffmpeg-out/windows
          desktop/engine/build_ffmpeg.sh host ffmpeg-out/host

      - name: Hand it to the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out
          if-no-files-found: error

  whisper:
    name: whisper.cpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for this build of whisper.cpp
        id: cache
        uses: actions/cache@v4
        with:
          path: whisper-out
          key: whisper-${{ hashFiles('desktop/engine/build_whisper.sh') }}

      # For Windows (cross-compiled with mingw-w64), and for the Linux tests below.
      - name: Build whisper.cpp
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 g++-mingw-w64-x86-64-posix ninja-build cmake glslc
          desktop/engine/build_whisper.sh windows whisper-out/windows
          desktop/engine/build_whisper.sh windows-vulkan whisper-out/windows
          desktop/engine/build_whisper.sh host whisper-out/host

      - name: Hand it to the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: whisper
          path: whisper-out
          if-no-files-found: error

  core:
    name: Core tests
    needs: [ffmpeg, whisper]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # The engine runner's tests start stand-in engines with this Python.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Packaging tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider desktop/engine

      # The speech models' sizes and SHA-256, as Chaya pins them, against Hugging Face's own list.
      - name: Speech models' pins
        run: python desktop/engine/check_models.py

      - name: Format
        working-directory: desktop
        run: cargo fmt -p chaya-core --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy -p chaya-core --all-targets -- -D warnings

      - name: Get ffmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out

      - name: Get whisper.cpp
        uses: actions/download-artifact@v4
        with:
          name: whisper
          path: whisper-out

      # The Tiny model, which the JFK sample is listened to with; checked against its pin by the tests.
      - name: Look for the Tiny speech model
        id: tiny
        uses: actions/cache@v4
        with:
          path: speech-model
          key: speech-tiny-${{ hashFiles('desktop/core/src/speech/models.json') }}

      - name: Fetch the Tiny speech model
        if: steps.tiny.outputs.cache-hit != 'true'
        run: |
          mkdir -p speech-model
          curl -fsSL --retry 3 -o speech-model/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      # The joining tests use the cut-down ffmpeg itself, built for Linux; the speech tests, whisper.cpp and the Tiny
      # model.
      - name: Test
        working-directory: desktop
        env:
          CHAYA_FFMPEG: ${{ github.workspace }}/ffmpeg-out/host/ffmpeg
          CHAYA_WHISPER: ${{ github.workspace }}/whisper-out/host/whisper-cli
          CHAYA_WHISPER_MODEL: ${{ github.workspace }}/speech-model/ggml-tiny.bin
        run: |
          chmod +x "$CHAYA_FFMPEG" "$CHAYA_WHISPER"
          cargo test -p chaya-core

      # The rules the window follows as clips are cut, lines are found and your own videos are added (desktop/app/ui/
      # clips.js, search.js, own.js): plain Node, a second.
      - name: Window tests
        working-directory: desktop/app
        run: node --test test/*.test.mjs

  windows:
    name: Windows build
    needs: [ffmpeg, whisper]
    runs-on: windows-latest
    # SignPath's action reads the unsigned files from this run's artifacts.
    permissions:
      contents: read
      actions: read
    # Whether the installer was signed with a certificate, for the release's notes.
    outputs:
      signed: ${{ steps.signing.outputs.on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get ffmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out

      - name: Get whisper.cpp
        uses: actions/download-artifact@v4
        with:
          name: whisper
          path: whisper-out

      - name: Look for the Tiny speech model
        id: tiny
        uses: actions/cache@v4
        with:
          path: speech-model
          key: speech-tiny-${{ hashFiles('desktop/core/src/speech/models.json') }}

      - name: Fetch the Tiny speech model
        if: steps.tiny.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p speech-model
          curl -fsSL --retry 3 -o speech-model/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the Tauri CLI
        working-directory: desktop/app
        run: npm ci

      - name: Put the engine together
        run: >-
          python desktop/engine/prepare.py --ffmpeg ffmpeg-out/windows/ffmpeg.exe
          --whisper whisper-out/windows/whisper-cli.exe --whisper-vulkan whisper-out/windows/whisper-cli-vulkan.exe

      # The runner has no graphics card, so the Vulkan build is tested on Lavapipe, Mesa's Vulkan driver that runs on the
      # processor: Vulkan's runtime (vulkan-1.dll), and Lavapipe, which the action registers as a driver.
      - name: Install Vulkan, with Lavapipe
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime_only: true
          install_lavapipe: true
          cache: true

      # Where Chaya looks for vulkan-1.dll (System32, then the PATH), as a graphics driver would put it.
      - name: Put Vulkan's runtime on the PATH
        shell: pwsh
        run: |
          $runtime = Get-ChildItem C:\VulkanSDK -Recurse -Filter 'vulkan-1.dll' | Where-Object { $_.DirectoryName -like '*x64*' } | Select-Object -First 1
          if (-not $runtime) { throw 'No 64-bit vulkan-1.dll under C:\VulkanSDK' }
          Add-Content $env:GITHUB_PATH $runtime.DirectoryName

      - name: Lint
        working-directory: desktop
        run: |
          node app/scripts/assemble-ui.mjs
          cargo clippy --workspace --all-targets -- -D warnings

      # CHAYA_ENGINE_DIR also runs the prepared engine's own check (core/tests/bundled_engine.rs): its Python
      # starts, the packages are the pinned ones, yt-dlp accepts the bundled QuickJS, and the bundled ffmpeg
      # joins a picture and its sound. The bundled whisper.cpp, cross-compiled, listens to the JFK sample on Windows: the
      # Vulkan build, on Lavapipe (which ggml uses only when told to, GGML_VK_VISIBLE_DEVICES, as it is no graphics
      # card), and it must say it used Vulkan (CHAYA_EXPECT_CARD).
      - name: Test
        working-directory: desktop
        env:
          CHAYA_ENGINE_DIR: ${{ github.workspace }}\desktop\app\src-tauri\engine
          CHAYA_FFMPEG: ${{ github.workspace }}\desktop\app\src-tauri\engine\ffmpeg.exe
          CHAYA_WHISPER: ${{ github.workspace }}\desktop\app\src-tauri\engine\whisper-cli.exe
          CHAYA_WHISPER_VULKAN: ${{ github.workspace }}\desktop\app\src-tauri\engine\whisper-cli-vulkan.exe
          CHAYA_WHISPER_MODEL: ${{ github.workspace }}\speech-model\ggml-tiny.bin
          GGML_VK_VISIBLE_DEVICES: '0'
          CHAYA_EXPECT_CARD: '1'
        run: cargo test --workspace -- --nocapture

      # Signing with a certificate, by SignPath (docs/BUILD_AND_TEST.md, "Signing the installer"). It is off until the
      # repository variable SIGNPATH_ORGANIZATION_ID is set; then a release (a windows-v* tag) is signed with the
      # release policy, and a run started by hand with "test_signing" with the test policy (a test certificate, for
      # trying the set-up without a release). Signed or not, everything after the build is the same.
      - name: Decide on signing
        id: signing
        shell: bash
        env:
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_signing }}
          RELEASE_POLICY: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          TEST_POLICY: ${{ vars.SIGNPATH_TEST_POLICY_SLUG || 'test-signing' }}
        run: |
          set -euo pipefail
          on=false
          policy=
          if [ -n "$ORGANIZATION" ] && [ "$RELEASE" = true ]; then on=true; policy=$RELEASE_POLICY; fi
          if [ -n "$ORGANIZATION" ] && [ "$TEST" = true ]; then on=true; policy=$TEST_POLICY; fi
          if [ "$TEST" = true ] && [ -z "$ORGANIZATION" ]; then
            echo "::error::Test signing was asked for, but SIGNPATH_ORGANIZATION_ID is not set (docs/BUILD_AND_TEST.md)."
            exit 1
          fi
          if [ "$on" = true ] && [ "$TOKEN_SET" != true ]; then
            echo "::error::SIGNPATH_ORGANIZATION_ID is set but the secret SIGNPATH_API_TOKEN is not (docs/BUILD_AND_TEST.md)."
            exit 1
          fi
          echo "on=$on" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "Signing with a certificate: $on${policy:+ ($policy)}"

      # A release (a windows-v* tag) also signs the update Chaya fetches from inside the app (update.rs), with the
      # key whose public half is in tauri.conf.json: TAURI_SIGNING_PRIVATE_KEY and its password are repository
      # secrets, and without them a release fails rather than ship an update no copy of Chaya would accept. The
      # tag must name the version in tauri.conf.json. When signing with a certificate, only the program is built
      # here: SignPath signs it before the installer is made from it.
      - name: Build the installer
        working-directory: desktop/app
        shell: bash
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
          SIGN: ${{ steps.signing.outputs.on }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/windows-v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/windows-v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          config='{}'
          if [ "$RELEASE" = true ]; then
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            if [ "windows-v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not name the app's version $version (src-tauri/tauri.conf.json)."
              exit 1
            fi
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: a release's update must be signed (docs/BUILD_AND_TEST.md)."
              exit 1
            fi
            config='{"bundle":{"createUpdaterArtifacts":true}}'
          fi
          if [ "$SIGN" = true ]; then
            npm run tauri -- build --no-bundle --config "$config"
          else
            npm run build -- --config "$config"
          fi

      # SignPath signs what it is given as an artifact of this run, checking it was built here from this repository
      # (origin verification), after the person who approves releases says so in SignPath, if the policy asks. The
      # artifact configurations it signs with are in .github/signpath/, kept in SignPath under the slugs below.
      - name: Hand SignPath the program
        id: unsigned-app
        if: steps.signing.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaya-unsigned-program
          path: desktop/target/release/chaya-desktop.exe
          if-no-files-found: error

      - name: Sign the program
        if: steps.signing.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'chaya' }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PROGRAM_CONFIGURATION_SLUG || 'program' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || 3600 }}
          output-artifact-directory: signed-program

      - name: Make the installer from the signed program
        if: steps.signing.outputs.on == 'true'
        working-directory: desktop/app
        shell: bash
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/windows-v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/windows-v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          cp ../../signed-program/chaya-desktop.exe ../target/release/chaya-desktop.exe
          config='{}'
          if [ "$RELEASE" = true ]; then config='{"bundle":{"createUpdaterArtifacts":true}}'; fi
          npm run tauri -- bundle --config "$config"

      - name: Hand SignPath the installer
        id: unsigned-installer
        if: steps.signing.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaya-unsigned-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: steps.signing.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'chaya' }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || 3600 }}
          output-artifact-directory: signed-installer

      # Signing changes the installer's bytes, so the update's own signature (made from the unsigned installer when
      # it was bundled) is made again from the signed one, or no copy of Chaya would accept the update.
      - name: Put the signed installer in place
        if: steps.signing.outputs.on == 'true'
        working-directory: desktop/app
        shell: bash
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/windows-v') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/windows-v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/windows-v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          nsis=../target/release/bundle/nsis
          for signed in ../../signed-installer/*.exe; do
            setup="$nsis/$(basename "$signed")"
            cp "$signed" "$setup"
            if [ "$RELEASE" = true ]; then
              rm -f "$setup.sig"
              npm run tauri -- signer sign "$setup"
              test -s "$setup.sig"
            fi
          done

      # Both files carry a certificate's signature (a test certificate is not trusted by Windows, but is there).
      - name: Check the signatures
        if: steps.signing.outputs.on == 'true'
        shell: pwsh
        run: |
          $files = @("desktop/target/release/chaya-desktop.exe") + (Get-ChildItem desktop/target/release/bundle/nsis -Filter *.exe).FullName
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if (-not $signature.SignerCertificate) { throw "$file carries no signature." }
            Write-Host "$file`: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: chaya-windows-installer
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  # The installer installed on a Windows machine and the app toured, with a picture of the whole screen at each
  # step (desktop/app/tour/tour.py): a saved video played with its subtitles, and subtitles made on the PC for a saved
  # speech with the Tiny model, fetched from Hugging Face (both videos put in place first: --seed), a tab kept from a
  # last run (also --seed) opened and the app still answering, Settings › AI model tested against a stand-in
  # service on the runner (its key through Windows Credential Manager, and not in ai.json), a link
  # looked up for real, a download cancelled, pages in the built-in
  # browser, the ad blocker's panel, Night. The pictures are kept as the run's `chaya-windows-tour` artifact, so
  # what the app looks like on Windows is seen, not guessed. A site that refuses this machine is noted in
  # steps.json, not failed on; the job fails only when the app does not start.
  tour:
    name: Windows tour
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the installer
        uses: actions/download-artifact@v4
        with:
          name: chaya-windows-installer
          path: installer

      - name: A screen big enough for the window
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Install Chaya, as a person would
        run: |
          $setup = (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $app = Get-ChildItem "$env:LOCALAPPDATA\Chaya" -Filter *.exe -Recurse |
            Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $app) { throw 'The installer put no Chaya program in place.' }
          "CHAYA_APP=$($app.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Installed: $($app.FullName)"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The tour drives the window through WebView2's DevTools port. The runner runs elevated, and WebView2
      # (from 150) ignores WEBVIEW2_* variables in an elevated app; the machine's policy is still read.
      - name: Open WebView2's DevTools port for Chaya
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          $name = Split-Path $env:CHAYA_APP -Leaf
          New-ItemProperty -Path $key -Name $name -Value '--remote-debugging-port=9333' -PropertyType String -Force | Out-Null
          Get-ItemProperty -Path $key

      - name: Take the tour
        run: |
          python -m pip install --quiet websocket-client pillow
          python desktop/app/tour/tour.py --app $env:CHAYA_APP --out tour --via devtools --seed

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaya-windows-tour
          path: tour
          if-no-files-found: warn

  # The newest build of main at one address that never changes, for the owner to install or update from without
  # digging through runs or unzipping: the `windows-preview` pre-release, its installer replaced after every merge
  # that changes the Windows app, once the tour has seen the app start.
  # https://github.com/<owner>/<repo>/releases/download/windows-preview/Chaya-Windows-preview-setup.exe
  # A pre-release is never the repository's "latest", so the phone's releases (v* tags) are untouched.
  preview:
    name: Windows preview
    needs: [windows, tour]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.test_signing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the installer
        uses: actions/download-artifact@v4
        with:
          name: chaya-windows-installer
          path: installer

      - name: Publish it as the preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          setup=$(ls installer/*.exe | head -n 1)
          cp "$setup" Chaya-Windows-preview-setup.exe
          title="Chaya for Windows (preview)"
          notes="The newest Chaya for Windows, built from ${GITHUB_SHA::7} on main on $(date -u '+%Y-%m-%d at %H:%M UTC').
          It is replaced after every merge that changes the Windows app; it is not a release.
          Run Chaya-Windows-preview-setup.exe to install, or to update the Chaya you have: your downloads, settings and sign-ins stay."
          if gh release view windows-preview >/dev/null 2>&1; then
            gh release edit windows-preview --prerelease --title "$title" --notes "$notes"
          else
            gh release create windows-preview --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
          gh release upload windows-preview Chaya-Windows-preview-setup.exe --clobber

  # A pull request's own installer, once the tour has seen it start: on the fixed `windows-test` prerelease, replaced by
  # the next pull request's build, so a change can be tried before it is merged (and without waiting for main's build).
  test-build:
    name: Windows test build
    needs: [windows, tour]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the installer
        uses: actions/download-artifact@v4
        with:
          name: chaya-windows-installer
          path: installer

      - name: Publish it as the test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          setup=$(ls installer/*.exe | head -n 1)
          cp "$setup" Chaya-Windows-test-setup.exe
          title="Chaya for Windows (test build of a pull request)"
          notes="Built from pull request #${PR_NUMBER} (${PR_TITLE}), commit ${PR_SHA::7}, on $(date -u '+%Y-%m-%d at %H:%M UTC').
          It is for trying a change before it is merged, and is replaced by the next pull request's build; it is not a release.
          Run Chaya-Windows-test-setup.exe to install, or to update the Chaya you have: your downloads, settings and sign-ins stay."
          if gh release view windows-test >/dev/null 2>&1; then
            gh release edit windows-test --prerelease --title "$title" --notes "$notes"
          else
            gh release create windows-test --prerelease --latest=false --target main --title "$title" --notes "$notes"
          fi
          gh release upload windows-test Chaya-Windows-test-setup.exe --clobber

  # A release of Chaya for Windows, from a windows-v* tag, once the tour has seen the app start: the installer on
  # its own release page (never the repository's "latest", which stays the phone's), with its notes from
  # docs/releases/windows-VERSION.md when there are any; and `latest.json` on the fixed `windows-latest` release,
  # which every copy of Chaya for Windows reads at most once a day to offer the update (update.rs).
  release:
    name: Windows release
    needs: [windows, tour]
    if: startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the installer
        uses: actions/download-artifact@v4
        with:
          name: chaya-windows-installer
          path: installer

      - name: Publish the release, and the update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#windows-v}"
          setup=$(ls installer/*.exe | head -n 1)
          name="Chaya-Windows-$version-setup.exe"
          cp "$setup" "$name"
          cp "$setup.sig" "$name.sig"
          notes_file="docs/releases/windows-$version.md"
          if [ ! -f "$notes_file" ]; then
            notes_file=$(mktemp)
            echo "Chaya for Windows $version." > "$notes_file"
          fi
          {
            cat "$notes_file"
            echo
            if [ "$SIGNED" = true ]; then
              echo "**Install:** download $name and run it. It is signed by SignPath Foundation; while its certificate"
              echo "is new, Windows may still say \"Windows protected your PC\": choose *More info*, then *Run anyway*."
            else
              echo "**Install:** download $name and run it. Windows may say \"Windows protected your PC\": the"
              echo "installer is not signed with a certificate yet, so choose *More info*, then *Run anyway*."
            fi
            echo "Chaya installs for you alone (no administrator needed), and an earlier Chaya is updated in place: your"
            echo "downloads, settings and sign-ins stay. From now on Chaya offers its own updates in its settings."
            echo
            echo "**Code signing policy:** https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
          } > release-notes.md
          # The release may already exist: GitHub's website makes a tag only by publishing a release with it, and a
          # failed run may be run again. Then the installer and notes go onto that release.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=false --prerelease=false --latest=false \
              --title "Chaya for Windows $version" --notes-file release-notes.md
            gh release upload "$tag" "$name" --clobber
          else
            gh release create "$tag" --latest=false --verify-tag --title "Chaya for Windows $version" \
              --notes-file release-notes.md "$name"
          fi
          # The repository's "latest" stays the phone's newest release, even if the website made this one latest.
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          if [[ "$latest" == windows-v* ]]; then
            phone=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
              --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // empty')
            if [ -n "$phone" ]; then gh release edit "$phone" --latest; fi
          fi

          # What every Chaya for Windows reads to offer this release: its version, notes and signed installer.
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          python3 - "$version" "$url" "$name.sig" "$notes_file" > latest.json <<'PY'
          import json, sys, datetime
          version, url, sig, notes = sys.argv[1:]
          print(json.dumps({
              "version": version,
              "notes": open(notes, encoding="utf-8").read().strip(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": {"signature": open(sig).read().strip(), "url": url}},
          }, indent=2))
          PY
          title="Chaya for Windows: the update"
          about="What Chaya for Windows reads to offer its newest release ($version). Not a release itself: the releases are the windows-v* ones."
          if gh release view windows-latest >/dev/null 2>&1; then
            gh release edit windows-latest --prerelease --title "$title" --notes "$about"
          else
            gh release create windows-latest --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes "$about"
          fi
          gh release upload windows-latest latest.json --clobber
