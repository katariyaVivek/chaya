name: Desktop app

# Chaya for Windows (desktop/): the core crate's tests on Linux, then the Tauri app built on Windows
# into an NSIS installer, kept as a run artifact. Titles in this installer use Geist: Cabinet Grotesk's
# licence keeps its file out of the repository (desktop/design/fonts/README.md).

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Format
        working-directory: desktop
        run: cargo fmt -p chaya-core --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy -p chaya-core --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test -p chaya-core

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install the Tauri CLI
        working-directory: desktop/app
        run: npm ci

      - name: Lint
        working-directory: desktop
        run: |
          node app/scripts/assemble-ui.mjs
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace

      - name: Build the installer
        working-directory: desktop/app
        run: npm run build

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: chaya-windows-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
