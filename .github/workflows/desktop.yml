name: Desktop app

# Chaya for Windows (desktop/): the core crate's tests on Linux (the ad blocker's read the phone's lists), then the Tauri app built on Windows
# into an NSIS installer, kept as a run artifact. On Windows the engine the installer carries (a Python,
# yt-dlp, gallery-dl, chaya_engine, QuickJS and ffmpeg: desktop/engine/prepare.py) is put together first and
# checked without the network. The cut-down ffmpeg that joins picture and sound is built once per version of
# its build script (desktop/engine/build_ffmpeg.sh) and kept in the Actions cache. Titles in this installer use Geist: Cabinet Grotesk's licence keeps its file out of
# the repository (desktop/design/fonts/README.md).

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/src/main/python/**'
      - 'app/src/main/assets/adblock/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/desktop.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
      - 'app/src/main/python/**'
      - 'app/src/main/assets/adblock/**'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    name: ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for this build of ffmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ hashFiles('desktop/engine/build_ffmpeg.sh') }}

      # For Windows (cross-compiled with mingw-w64), and for the Linux tests below.
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64
          desktop/engine/build_ffmpeg.sh windows ffmpeg-out/windows
          desktop/engine/build_ffmpeg.sh host ffmpeg-out/host

      - name: Hand it to the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out
          if-no-files-found: error

  core:
    name: Core tests
    needs: ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # The engine runner's tests start stand-in engines with this Python.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Packaging tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider desktop/engine

      - name: Format
        working-directory: desktop
        run: cargo fmt -p chaya-core --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy -p chaya-core --all-targets -- -D warnings

      - name: Get ffmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out

      # The joining tests use the cut-down ffmpeg itself, built for Linux.
      - name: Test
        working-directory: desktop
        env:
          CHAYA_FFMPEG: ${{ github.workspace }}/ffmpeg-out/host/ffmpeg
        run: |
          chmod +x "$CHAYA_FFMPEG"
          cargo test -p chaya-core

  windows:
    name: Windows build
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get ffmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the Tauri CLI
        working-directory: desktop/app
        run: npm ci

      - name: Put the engine together
        run: python desktop/engine/prepare.py --ffmpeg ffmpeg-out/windows/ffmpeg.exe

      - name: Lint
        working-directory: desktop
        run: |
          node app/scripts/assemble-ui.mjs
          cargo clippy --workspace --all-targets -- -D warnings

      # CHAYA_ENGINE_DIR also runs the prepared engine's own check (core/tests/bundled_engine.rs): its Python
      # starts, the packages are the pinned ones, yt-dlp accepts the bundled QuickJS, and the bundled ffmpeg
      # joins a picture and its sound.
      - name: Test
        working-directory: desktop
        env:
          CHAYA_ENGINE_DIR: ${{ github.workspace }}\desktop\app\src-tauri\engine
          CHAYA_FFMPEG: ${{ github.workspace }}\desktop\app\src-tauri\engine\ffmpeg.exe
        run: cargo test --workspace -- --nocapture

      - name: Build the installer
        working-directory: desktop/app
        run: npm run build

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: chaya-windows-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The installer installed on a Windows machine and the app toured, with a picture of the whole screen at each
  # step (desktop/app/tour/tour.py): a link looked up for real, a download cancelled, pages in the built-in
  # browser, the ad blocker's panel, Night. The pictures are kept as the run's `chaya-windows-tour` artifact, so
  # what the app looks like on Windows is seen, not guessed. A site that refuses this machine is noted in
  # steps.json, not failed on; the job fails only when the app does not start.
  tour:
    name: Windows tour
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the installer
        uses: actions/download-artifact@v4
        with:
          name: chaya-windows-installer
          path: installer

      - name: A screen big enough for the window
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Install Chaya, as a person would
        run: |
          $setup = (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $app = Get-ChildItem "$env:LOCALAPPDATA\Chaya" -Filter *.exe -Recurse |
            Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $app) { throw 'The installer put no Chaya program in place.' }
          "CHAYA_APP=$($app.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Installed: $($app.FullName)"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The tour drives the window through WebView2's DevTools port. The runner runs elevated, and WebView2
      # (from 150) ignores WEBVIEW2_* variables in an elevated app; the machine's policy is still read.
      - name: Open WebView2's DevTools port for Chaya
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          $name = Split-Path $env:CHAYA_APP -Leaf
          New-ItemProperty -Path $key -Name $name -Value '--remote-debugging-port=9333' -PropertyType String -Force | Out-Null
          Get-ItemProperty -Path $key

      - name: Take the tour
        run: |
          python -m pip install --quiet websocket-client pillow
          python desktop/app/tour/tour.py --app $env:CHAYA_APP --out tour --via devtools

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaya-windows-tour
          path: tour
          if-no-files-found: warn

  # The newest build of main at one address that never changes, for the owner to install or update from without
  # digging through runs or unzipping: the `windows-preview` pre-release, its installer replaced after every merge
  # that changes the Windows app, once the tour has seen the app start.
  # https://github.com/<owner>/<repo>/releases/download/windows-preview/Chaya-Windows-preview-setup.exe
  # A pre-release is never the repository's "latest", so the phone's releases (v* tags) are untouched.
  preview:
    name: Windows preview
    needs: [windows, tour]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the installer
        uses: actions/download-artifact@v4
        with:
          name: chaya-windows-installer
          path: installer

      - name: Publish it as the preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          setup=$(ls installer/*.exe | head -n 1)
          cp "$setup" Chaya-Windows-preview-setup.exe
          title="Chaya for Windows (preview)"
          notes="The newest Chaya for Windows, built from ${GITHUB_SHA::7} on main on $(date -u '+%Y-%m-%d at %H:%M UTC').
          It is replaced after every merge that changes the Windows app; it is not a release.
          Run Chaya-Windows-preview-setup.exe to install, or to update the Chaya you have: your downloads, settings and sign-ins stay."
          if gh release view windows-preview >/dev/null 2>&1; then
            gh release edit windows-preview --prerelease --title "$title" --notes "$notes"
          else
            gh release create windows-preview --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
          gh release upload windows-preview Chaya-Windows-preview-setup.exe --clobber
