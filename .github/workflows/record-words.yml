name: Turbo on Vulkan (temporary)

# Runs Large v3 Turbo through whisper.cpp's Vulkan build on Lavapipe, as Chaya runs it, to see whether it fails there
# as it does on a tester's graphics card. Removed once read.

on:
  push:
    branches: [ claude/fervent-heisenberg-ifnlnu ]
    paths: [ '.github/workflows/record-words.yml' ]

jobs:
  turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build whisper.cpp with Vulkan for Linux, and fetch the models
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev glslc mesa-vulkan-drivers vulkan-tools spirv-headers ffmpeg cmake ninja-build
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp src
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DWHISPER_SDL2=OFF -DWHISPER_BUILD_TESTS=OFF > cfg.log 2>&1 || tail -40 cfg.log
          cmake --build build --target whisper-cli -j4 > build.log 2>&1 || tail -40 build.log
          curl -fsSL --retry 3 -o tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl -fsSL --retry 3 -o turbo.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          ffmpeg -hide_banner -loglevel error -i desktop/core/tests/fixtures/jfk.m4a -ac 1 -ar 16000 -c:a pcm_s16le jfk.wav
          vulkaninfo --summary 2>&1 | head -30 || true
      - name: Tiny on Vulkan, as Chaya runs it
        env: { GGML_VK_VISIBLE_DEVICES: '0' }
        run: |
          set +e
          ./build/bin/whisper-cli -m tiny.bin -f jfk.wav -l auto -t 4 -ojf -pp -dtw tiny -nfa -of tiny 2>&1 | grep -v "^whisper_print_progress" | tail -40
          echo "exit: ${PIPESTATUS[0]}"; ls -la tiny.json
      - name: Turbo on Vulkan, as Chaya runs it
        env: { GGML_VK_VISIBLE_DEVICES: '0' }
        run: |
          set +e
          ./build/bin/whisper-cli -m turbo.bin -f jfk.wav -l auto -t 4 -ojf -pp -dtw large.v3.turbo -nfa -of turbo 2>&1 | grep -v "^whisper_print_progress" | tail -60
          echo "exit: ${PIPESTATUS[0]}"; ls -la turbo.json
      - name: Turbo on Vulkan without DTW
        env: { GGML_VK_VISIBLE_DEVICES: '0' }
        run: |
          set +e
          ./build/bin/whisper-cli -m turbo.bin -f jfk.wav -l auto -t 4 -ojf -pp -nfa -of plain 2>&1 | grep -v "^whisper_print_progress" | tail -30
          echo "exit: ${PIPESTATUS[0]}"; ls -la plain.json
