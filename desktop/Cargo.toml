# Chaya for Windows. `core` is plain Rust with no window or web view in it, so it builds and tests
# anywhere; `app/src-tauri` is the Tauri app around it.
[workspace]
members = ["core", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
