<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaya</title>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/fonts.css">
<link rel="stylesheet" href="design/components.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="main.js"></script>
</head>
<body>
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-post" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9.5" cy="9.5" r="1.6" fill="currentColor"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L19 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-account" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 19.5c1.2-3.2 3.8-4.8 7-4.8s5.8 1.6 7 4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-page" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.5 5.2 3.5 8.5s-1.1 6.1-3.5 8.5c-2.4-2.4-3.5-5.2-3.5-8.5s1.1-6.1 3.5-8.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V8h-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-zip" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 9.5h2M13 12h2M13 14.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 11L12 4.5l7.5 6.5M6.5 9.5v9h4v-5h3v5h4v-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m0 0l6-6m-6 6l6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M5 12h14m0 0l-6-6m6 6l-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.4c0 4.3-2.9 7.8-7 9-4.1-1.2-7-4.7-7-9V6.1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
</svg>

<header class="top" data-tauri-drag-region="deep">
  <nav class="tabstrip" id="tabstrip" aria-label="Tabs" hidden>
    <div class="tabstrip__tabs" role="tablist"></div>
    <button class="icon-btn pressable tabstrip__new" type="button" id="tab-new" aria-label="New tab" title="New tab (Ctrl+T)"><svg><use href="#i-plus"/></svg></button>
  </nav>
  <div class="settings">
    <button class="icon-btn pressable" type="button" id="settings-button" aria-label="Appearance" aria-expanded="false" aria-controls="settings-panel">
      <svg><use href="#i-settings"/></svg>
    </button>
    <div class="settings__panel glass" id="settings-panel" data-tauri-drag-region="false" hidden>
      <p class="settings__label">Theme</p>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="day">Day</button>
        <button type="button" data-theme-choice="night">Night</button>
        <button type="button" data-theme-choice="system">Same as Windows</button>
      </div>
      <p class="settings__label">Motion</p>
      <div class="seg" role="group" aria-label="Motion">
        <button type="button" data-motion-choice="system">Same as Windows</button>
        <button type="button" data-motion-choice="reduce">Reduced</button>
      </div>
      <div class="settings__update" id="settings-update" hidden>
        <p class="settings__label">Update</p>
        <p class="settings__note" id="update-text"></p>
        <button class="pill pill--primary pressable" type="button" id="update-install">Update and restart</button>
      </div>
      <p class="settings__credit"><span id="app-version"></span> Titles are set in Cabinet Grotesk by Indian Type Foundry.</p>
    </div>
  </div>
  <!-- Chaya draws the window's title bar: this row. Its buttons are Windows' own three, drawn as Windows draws them. -->
  <div class="caption" id="caption">
    <button class="caption__btn" type="button" id="caption-min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
    <button class="caption__btn" type="button" id="caption-max" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect class="caption__max" x="0.5" y="0.5" width="9" height="9"/><path class="caption__restore" d="M2.5 2.5V0.5h7v7h-2M0.5 2.5h7v7h-7z"/></svg></button>
    <button class="caption__btn caption__btn--close" type="button" id="caption-close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>
  </div>
</header>

<main class="main">
  <form class="urlbar" id="address-form" autocomplete="off">
    <div class="page-nav" data-browsing hidden>
      <button class="icon-btn pressable" type="button" id="page-back" aria-label="Back" title="Back"><svg><use href="#i-back"/></svg></button>
      <button class="icon-btn pressable" type="button" id="page-forward" aria-label="Forward" title="Forward"><svg><use href="#i-forward"/></svg></button>
      <button class="icon-btn pressable" type="button" id="page-reload" aria-label="Reload" title="Reload"><svg><use href="#i-retry"/></svg></button>
      <button class="icon-btn pressable" type="button" id="page-home" aria-label="Home" title="Home"><svg><use href="#i-home"/></svg></button>
    </div>
    <label class="urlbar__field glass" for="address">
      <svg class="urlbar__icon"><use href="#i-link"/></svg>
      <input class="urlbar__input" id="address" type="text" spellcheck="false" placeholder="Paste a link, or search" aria-describedby="address-hint">
      <span class="kbd" id="address-hint">Ctrl L</span>
    </label>
    <div class="page-nav" data-browsing hidden>
      <div class="media">
        <button class="pill glass pressable page-media" type="button" id="page-media" aria-expanded="false" aria-controls="media-panel" hidden><svg><use href="#i-video"/></svg><span class="page-media__label"></span></button>
        <div class="settings__panel media__panel glass" id="media-panel" aria-label="On this page" hidden></div>
      </div>
      <div class="shield">
        <button class="icon-btn pressable page-shield" type="button" id="page-shield" aria-label="Ad blocker" title="Ad blocker" aria-expanded="false" aria-controls="shield-panel"><svg><use href="#i-shield"/></svg><span class="page-count num" hidden></span></button>
        <div class="settings__panel shield__panel glass" id="shield-panel" hidden>
          <p class="shield__status" id="shield-status" role="status"></p>
          <p class="settings__label" id="shield-site-label">On this site</p>
          <div class="seg" role="group" aria-labelledby="shield-site-label" id="shield-site">
            <button type="button" data-site-ads="block">Block ads</button>
            <button type="button" data-site-ads="show">Show ads</button>
          </div>
          <p class="settings__label" id="shield-all-label">Everywhere</p>
          <div class="seg" role="group" aria-labelledby="shield-all-label">
            <button type="button" data-all-ads="block">Block ads</button>
            <button type="button" data-all-ads="show">Show ads</button>
          </div>
          <p class="settings__credit" id="shield-lists"></p>
        </div>
      </div>
      <button class="icon-btn pressable page-downloads" type="button" id="page-downloads" aria-label="Downloads" title="Downloads" aria-pressed="false"><svg><use href="#i-download"/></svg><span class="page-count num" hidden></span></button>
    </div>
  </form>

  <section class="result" id="result" aria-live="polite"></section>

  <p class="notice" id="page-notice" role="status" hidden><span class="notice__text"></span><button class="notice__action" type="button" hidden></button></p>

  <section class="found" id="found" aria-label="Found on this page" hidden>
    <ul class="found__list"></ul>
    <button class="found__more" type="button" hidden></button>
  </section>

  <div class="page-frame" data-browsing hidden>
    <span class="page-load" id="page-load" aria-hidden="true"></span>
    <div class="page" id="page"><img class="page__still" id="page-still" alt="" hidden></div>
  </div>

  <section class="downloads" aria-labelledby="downloads-title">
    <div class="downloads__head">
      <h1 class="title" id="downloads-title">Downloads</h1>
      <div class="seg downloads__view" role="group" aria-label="Show downloads as" id="downloads-view" hidden>
        <button type="button" data-view="list" aria-pressed="true">List</button>
        <button type="button" data-view="grid" aria-pressed="false">Grid</button>
      </div>
      <label class="find" id="downloads-find-field" hidden>
        <svg><use href="#i-search"/></svg>
        <input class="find__input" id="downloads-find" type="search" spellcheck="false" placeholder="Find in downloads" aria-label="Find in downloads">
      </label>
    </div>
    <div class="narrow" id="downloads-narrow" role="group" aria-label="Show only" hidden>
      <div class="narrow__group" id="narrow-kind"></div>
      <span class="narrow__rule" aria-hidden="true"></span>
      <div class="narrow__group" id="narrow-site"></div>
    </div>
    <ul class="list" id="download-list" aria-labelledby="downloads-title"></ul>
    <!-- The grid, as the phone's library: what was saved, pictures showing themselves, a post's files on one tile -->
    <div class="grid-wrap" id="download-grid-wrap" hidden>
      <button class="pill glass pressable grid__running" type="button" id="grid-running" hidden></button>
      <ul class="grid" id="download-grid" aria-labelledby="downloads-title"></ul>
    </div>
    <p class="downloads__none" id="downloads-none" hidden>Nothing here matches. <button class="downloads__all" type="button" id="narrow-clear">Show everything</button></p>
    <div class="empty" id="downloads-empty">
      <span class="empty__icon"><svg><use href="#i-download"/></svg></span>
      <p>What you download appears here. Paste a link above to start.</p>
    </div>
  </section>
</main>

<template id="lookup-template">
  <article class="card card--media glass">
    <div class="poster" aria-hidden="true"><img alt="" referrerpolicy="no-referrer"></div>
    <div class="card__body">
      <h2 class="card__title"></h2>
      <p class="card__meta"></p>
      <div class="card__state"></div>
    </div>
  </article>
</template>

<template id="dl-template">
  <button class="dl pill pill--primary glass" type="button">
    <span class="dl__label">Download</span>
    <span class="dl__ring" aria-hidden="true">
      <svg class="dl__svg" viewBox="0 0 40 40"><circle class="dl__track" cx="20" cy="20" r="17"/><circle class="dl__arc" cx="20" cy="20" r="17" pathLength="100"/><path class="dl__check" d="M14 20.5l4 4 8-9" pathLength="1"/></svg>
      <span class="dl__pct num">0%</span>
    </span>
  </button>
</template>

<template id="row-template">
  <li class="row glass">
    <div class="row__thumb"><img alt="" referrerpolicy="no-referrer"><svg><use href=""/></svg></div>
    <div class="row__body">
      <button class="row__title" type="button"></button>
      <div class="row__meta num"></div>
      <div class="row__bar"><span></span></div>
    </div>
    <span class="row__pct num"></span>
    <div class="row__actions">
      <button class="icon-btn pressable row__main" type="button"><svg><use href=""/></svg></button>
      <button class="icon-btn pressable row__close" type="button"><svg><use href="#i-close"/></svg></button>
    </div>
  </li>
</template>

<template id="tab-template">
  <div class="tab" role="tab" aria-selected="false">
    <button class="tab__title" type="button"></button>
    <button class="tab__close" type="button" aria-label="Close tab" title="Close tab (Ctrl+W)"><svg><use href="#i-close"/></svg></button>
  </div>
</template>

<template id="found-template">
  <li class="found__item">
    <span class="found__icon"><svg><use href=""/></svg></span>
    <div class="found__body">
      <p class="found__name"></p>
      <p class="found__meta num"></p>
      <div class="found__state"></div>
    </div>
    <div class="found__action"></div>
  </li>
</template>

<template id="result-template">
  <article class="card glass">
    <span class="card__icon"><svg><use href=""/></svg></span>
    <div class="card__body">
      <h2 class="card__title"></h2>
      <p class="card__url num"></p>
      <p class="card__note"></p>
    </div>
  </article>
</template>
<!-- A saved picture, or a post's files, one at a time over the window -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Pictures" hidden>
  <div class="viewer__top">
    <p class="viewer__title" id="viewer-title"></p>
    <span class="viewer__count num" id="viewer-count"></span>
    <button class="icon-btn pressable" type="button" id="viewer-folder" aria-label="Show in folder" title="Show in folder"><svg><use href="#i-folder"/></svg></button>
    <button class="icon-btn pressable" type="button" id="viewer-close" aria-label="Close (Esc)" title="Close (Esc)"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="viewer__stage">
    <button class="icon-btn pressable viewer__step" type="button" id="viewer-prev" aria-label="Previous" title="Previous (←)"><svg><use href="#i-back"/></svg></button>
    <figure class="viewer__frame" id="viewer-frame"></figure>
    <button class="icon-btn pressable viewer__step" type="button" id="viewer-next" aria-label="Next" title="Next (→)"><svg><use href="#i-forward"/></svg></button>
  </div>
</div>
</body>
</html>
