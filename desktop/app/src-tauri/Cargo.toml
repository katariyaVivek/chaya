[package]
name = "chaya-desktop"
description = "Chaya for Windows"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true

[lib]
name = "chaya_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
chaya-core = { path = "../../core" }
# "unstable": a page in a webview of its own inside the window (the built-in browser).
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A saved video's poster, as the window hands it over (`keep_poster`).
base64 = "0.23"
tokio = { version = "1", features = ["sync", "time"] }
# The key to the person's AI service, kept in Windows Credential Manager (Settings › AI model), never in a file.
keyring = { version = "3", features = ["windows-native"] }
# Windows' own TLS (Schannel), as the core's downloads use, and the PC's proxy; an update is the NSIS installer
# itself, so no archive formats.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }

# The page's requests, for the ad blocker: the same WebView2 bindings Tauri uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
windows-core = "0.62"

# The update key's check (update.rs): what the updater itself verifies with.
[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
