[package]
name = "chaya-core"
description = "What Chaya for Windows does, without its window: recognising and looking up links, and downloading."
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
aes = "0.9"
cbc = "0.2"
futures-util = "0.3"
psl = "2"
# Windows' own TLS (Schannel): the PC's certificates and proxy settings, no extra build tools.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
url = "2"


[dev-dependencies]
tempfile = "3"
