[package]
name = "chaya-core"
description = "What Chaya for Windows does, without its window: recognising and looking up links, and downloading."
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true

[dependencies]
aes = "0.9"
cbc = "0.2"
futures-util = "0.3"
psl = "2"
# Windows' own TLS (Schannel): the PC's certificates and proxy settings, no extra build tools.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "system-proxy", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Speech models are checked against the SHA-256 Chaya pins.
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
# The search across every video's lines matches letters without their accents ("ecole" finds "École").
unicode-normalization = "0.1.26"
url = "2"
# Accounts saved as one ZIP: their pictures and videos stored as they are, ZIP64 for the very large.
zip = { version = "9", default-features = false }


[dev-dependencies]
tempfile = "3"

# Which graphics card whisper.cpp listens on (`speech::card`): Vulkan's own list of them, read from Windows'
# vulkan-1.dll when it is first needed (loaded, not linked, so a PC without Vulkan still starts).
[target.'cfg(windows)'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
