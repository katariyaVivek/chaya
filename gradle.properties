org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# CI + local build speed: cache task outputs across builds, run independent
# modules/tasks in parallel. Verified safe with AGP 8.7.3 / Gradle 8.9.
org.gradle.caching=true
org.gradle.parallel=true
# AGP 8.7.3 is only tested up to API 35; compileSdk 36 is needed by quickjs-kt (see app/build.gradle.kts).
android.suppressUnsupportedCompileSdk=36
