org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# CI + local build speed: cache task outputs across builds.
org.gradle.caching=true
# Parallel project execution stays off. Chaquopy adds a dependency owned by the root project, and with
# parallel on, :app:kspDebugKotlin failed resolving it ("Current thread does not hold the state lock for
# root project"). The app is the only module, so parallel execution gained nothing.
org.gradle.parallel=false
